<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https:; font-src 'self' data:;" />
  <title>Weft</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="titlebar">
    <div class="tb-left">
      <div class="logo" aria-hidden="true"><span></span></div>
      <button id="tb-sidebar" class="icon-btn tb-btn" title="Toggle sidebar (Ctrl+\)"><span data-icon="panelLeft"></span></button>
      <button id="vault-name" class="tb-vault" title="Vault options">Vault</button>
    </div>
    <button id="tb-search" class="tb-search">
      <span data-icon="search"></span>
      <span class="tb-search-text">Search or jump to…</span>
      <kbd>Ctrl O</kbd>
    </button>
    <div class="tb-right"></div>
  </header>

  <div id="app">
    <nav id="ribbon">
      <button data-panel="files" class="rb active" title="Files"><span data-icon="files"></span></button>
      <button data-panel="search" class="rb" title="Search (Ctrl+Shift+F)"><span data-icon="search"></span></button>
      <button data-panel="tags" class="rb" title="Tags"><span data-icon="hash"></span></button>
      <button data-panel="calendar" class="rb" title="Calendar"><span data-icon="calendar"></span></button>
      <div class="rb-sep"></div>
      <button id="rb-graph" class="rb" title="Graph view (Ctrl+G)"><span data-icon="graph"></span></button>
      <button id="rb-daily" class="rb" title="Today's daily note (Ctrl+Shift+D)"><span data-icon="sun"></span></button>
      <button id="rb-palette" class="rb" title="Command palette (Ctrl+P)"><span data-icon="command"></span></button>
      <div class="rb-spacer"></div>
      <button id="rb-focus" class="rb" title="Focus mode (Ctrl+Shift+Enter)"><span data-icon="focus"></span></button>
      <button id="rb-theme" class="rb" title="Switch light / dark (Ctrl+Shift+L)"><span data-icon="moon"></span></button>
      <button id="rb-settings" class="rb" title="Settings (Ctrl+,)"><span data-icon="gear"></span></button>
    </nav>

    <aside id="sidebar">
      <section class="panel" data-panel="files">
        <div class="panel-head">
          <span class="panel-title">Notes</span>
          <div class="panel-actions">
            <button id="btn-new-note" class="icon-btn" title="New note (Ctrl+N)"><span data-icon="plus"></span></button>
            <button id="btn-new-folder" class="icon-btn" title="New folder"><span data-icon="folderPlus"></span></button>
            <button id="btn-collapse" class="icon-btn" title="Collapse all"><span data-icon="collapse"></span></button>
          </div>
        </div>
        <div id="tree" class="scroll"></div>
      </section>
      <section class="panel hidden" data-panel="search">
        <div class="panel-head"><span class="panel-title">Search</span></div>
        <div class="search-box">
          <span data-icon="search"></span>
          <input id="search-input" placeholder="Search notes, or #tag" spellcheck="false" />
        </div>
        <div id="search-results" class="scroll"></div>
      </section>
      <section class="panel hidden" data-panel="tags">
        <div class="panel-head"><span class="panel-title">Tags</span></div>
        <div id="tag-list" class="scroll"></div>
      </section>
      <section class="panel hidden" data-panel="calendar">
        <div class="panel-head">
          <span class="panel-title">Calendar</span>
          <div class="panel-actions">
            <button id="cal-today" class="icon-btn" title="Today"><span data-icon="dot"></span></button>
          </div>
        </div>
        <div id="calendar" class="scroll"></div>
      </section>
      <div id="sidebar-resizer"></div>
    </aside>

    <main id="main">
      <div id="panes"></div>

      <div id="graph-view" class="view hidden">
        <canvas id="graph-canvas"></canvas>
        <div class="graph-hud">
          <div class="graph-title">
            <span data-icon="graph"></span> Graph
            <span id="graph-count" class="muted"></span>
          </div>
          <div class="graph-hud-actions">
            <button class="btn sm ghost" id="g-timelapse" title="Watch your vault grow"><span data-icon="play"></span> Time-lapse</button>
            <button class="icon-btn" id="graph-close" title="Back to note (Esc)"><span data-icon="x"></span></button>
          </div>
        </div>
        <div class="graph-panel" id="graph-panel">
          <button class="gp-head" id="gp-toggle"><span data-icon="sliders"></span> Display <span data-icon="chev" class="gp-chev"></span></button>
          <div class="gp-body">
            <div class="search-box sm">
              <span data-icon="search"></span>
              <input id="graph-filter" placeholder="Filter nodes…" spellcheck="false" />
            </div>
            <label class="toggle"><input type="checkbox" id="g-tags" /> <span></span> Tags</label>
            <label class="toggle"><input type="checkbox" id="g-ghosts" checked /> <span></span> Unresolved links</label>
            <label class="toggle"><input type="checkbox" id="g-orphans" checked /> <span></span> Orphans</label>
            <label class="toggle"><input type="checkbox" id="g-folders" checked /> <span></span> Color by folder</label>
            <label class="toggle"><input type="checkbox" id="g-arrows" /> <span></span> Arrows</label>
            <div class="slider"><span>Node size</span><input type="range" id="g-size" min="0.5" max="2.5" step="0.05" value="1" /></div>
            <div class="slider"><span>Link distance</span><input type="range" id="g-dist" min="20" max="240" step="1" value="80" /></div>
            <div class="slider"><span>Repel force</span><input type="range" id="g-repel" min="40" max="1500" step="5" value="300" /></div>
            <div class="slider"><span>Text fade</span><input type="range" id="g-label" min="0.1" max="2.5" step="0.05" value="0.45" /></div>
            <button class="btn sm wide" id="g-fit"><span data-icon="fit"></span> Fit to screen</button>
            <div class="gp-row">
              <button class="btn sm" id="g-export-png" title="Save the graph as a high-resolution image"><span data-icon="image"></span> PNG</button>
              <button class="btn sm" id="g-export-html" title="Save an interactive web page of the graph (note titles only)"><span data-icon="globe"></span> Web page</button>
            </div>
          </div>
        </div>
        <div class="timeline hidden" id="timeline">
          <button class="tl-play" id="tl-play" title="Play / pause (Space)"><span data-icon="pause"></span></button>
          <div class="tl-track">
            <input type="range" id="tl-range" min="0" max="1" step="1" value="0" />
            <div class="tl-meta"><span id="tl-date"></span><span id="tl-count" class="muted"></span></div>
          </div>
          <button class="icon-btn" id="tl-close" title="Exit time-lapse"><span data-icon="x"></span></button>
        </div>
        <div id="graph-tip" class="graph-tip hidden"></div>
      </div>

      <footer id="statusbar">
        <span id="st-save"></span>
        <span class="st-spacer"></span>
        <span id="st-links"></span>
        <span id="st-words"></span>
      </footer>
    </main>

    <aside id="rightpanel">
      <div class="lg-wrap" id="lg-wrap">
        <div class="rp-head">
          <span data-icon="graph" data-size="14"></span> Local graph
          <div class="lg-depth" id="lg-depth">
            <button data-d="1">1</button><button data-d="2" class="on">2</button><button data-d="3">3</button>
          </div>
          <button class="icon-btn sm" id="lg-open" title="Open full graph"><span data-icon="expand" data-size="14"></span></button>
        </div>
        <canvas id="lg-canvas"></canvas>
      </div>
      <div id="rp-content" class="scroll"></div>
    </aside>
  </div>

  <div id="hover" class="hover-card hidden"></div>
  <div id="ctx" class="ctxmenu hidden"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="../node_modules/marked/marked.min.js"></script>
  <script src="icons.js"></script>
  <script src="graph.js"></script>
  <script src="editor.bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
